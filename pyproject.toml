[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-behavior-benchmark"
version = "0.1.0"
description = "Safety-oriented benchmark for competitive LLM agent behavior research."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-bench = "agent_behavior_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_behavior_benchmark*"]

